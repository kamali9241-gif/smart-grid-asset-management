server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy API calls to the backend container so the browser only ever talks
    # to this origin (avoids CORS and keeps the frontend build environment-agnostic).
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Client-side routing: unknown paths fall back to index.html.
    location / {
        try_files $uri /index.html;
    }
}
